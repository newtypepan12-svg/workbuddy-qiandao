name: WorkBuddy Daily Check-in

on:
  schedule:
    # 每天 09:05（Asia/Shanghai）= 01:05 UTC
    - cron: "5 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run WorkBuddy check-in
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
        run: python scripts/checkin.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/checkins.json data/last-run.json
          if git diff --staged --quiet; then
            echo "No history change"
          else
            git commit -m "checkin: $(python -c "import json;print(json.load(open('data/last-run.json')).get('date',''))")"
            git push
          fi

      - name: Summary
        run: |
          python <<'PY'
          import json, os, pathlib
          p = pathlib.Path("data/last-run.json")
          d = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as f:
              f.write("### WorkBuddy 签到\n")
              f.write(f"- 日期: {d.get('date')}\n")
              f.write(f"- 状态: {d.get('status')}\n")
              f.write(f"- 连续: {d.get('streak')} 天\n")
              f.write(f"- 累计: {d.get('total')} 天\n")
              f.write(f"- 说明: {d.get('report')}\n")
          PY
